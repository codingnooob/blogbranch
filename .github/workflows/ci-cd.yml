name: CI/CD Pipeline v4 - Cache Busted

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Verify critical dependencies
        run: |
          echo "Checking @babel/preset-env..."
          npm list @babel/preset-env || echo "Babel preset missing, reinstalling..."
          if ! npm list @babel/preset-env > /dev/null 2>&1; then
            echo "Installing @babel/preset-env explicitly..."
            npm install --save-dev @babel/preset-env
          fi

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Build Firefox version
        run: npm run build:firefox

      - name: Create packages
        run: npm run package:all-formats

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-packages-${{ matrix.node-version }}
          path: |
            *.zip
            *.crx
            *.xpi
          retention-days: 30

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run security audit
        run: npm audit --audit-level=moderate || true

      - name: Generate security report
        run: |
          echo "Security audit completed"
          npm audit --audit-level=high --json > security-report.json || true
          echo "Security report generated"

  store-deployment:
    needs: [test, security-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published' && !contains(github.event.release.name, 'next')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Clear Actions Cache
        run: |
          echo "Clearing any potential workflow cache..."
          rm -rf ~/.cache || true

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Verify critical dependencies
        run: |
          echo "Checking @babel/preset-env..."
          npm list @babel/preset-env || echo "Babel preset missing, reinstalling..."
          if ! npm list @babel/preset-env > /dev/null 2>&1; then
            echo "Installing @babel/preset-env explicitly..."
            npm install --save-dev @babel/preset-env
          fi

      - name: Build and package
        run: |
          npm run build
          npm run build:firefox
          npm run package:all-formats

      - name: Verify artifacts exist
        run: |
          ls -la *.zip *.crx *.xpi 2>/dev/null || echo "Some artifacts missing"

      - name: Deploy to Chrome Web Store
        uses: PlasmoHQ/bpp@v2
        with:
          keys: ${{ secrets.CHROME_CLIENT_ID }}:${{ secrets.CHROME_CLIENT_SECRET }}:${{ secrets.CHROME_REFRESH_TOKEN }}
          zip: blog-link-analyzer-*.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
        continue-on-error: true

      - name: Deploy to Firefox Add-ons
        run: |
          echo "Deploying to Firefox Add-ons..."
          
          # Find the XPI file
          XPI_FILE=$(ls blog-link-analyzer-firefox-*.xpi | head -n 1)
          echo "Found XPI file: $XPI_FILE"
          
          # Deploy using Firefox Add-ons API
          if [ -n "$XPI_FILE" ]; then
            curl -X POST \
              "https://addons.mozilla.org/api/v5/addons/" \
              -H "Authorization: JWT ${{ secrets.FIREFOX_JWT_ISSUER }}" \
              -H "Content-Type: application/json" \
              -d "{
                \"upload\": {
                  \"uuid\": \"$(uuidgen)\",
                  \"version\": \"$(node -p -e 'require(\"./package.json\").version')\",
                  \"channel\": \"listed\"
                }
              }" \
              --form "upload=@$XPI_FILE" \
              --verbose
          else
            echo "No XPI file found to deploy"
          fi
        continue-on-error: true

      - name: Notify deployment success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 **Store Deployment Successful**\n\n✅ Chrome Web Store: Submitted for review\n✅ Firefox Add-ons: Submitted for review\n\nRelease: ${{ github.event.release.tag_name }}'
            })

      - name: Notify deployment failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Store Deployment Failed**\n\nPlease check the workflow logs for details.\nRelease: ${{ github.event.release.tag_name }}\n\nTo rollback, run:\n```bash\n./scripts/rollback.sh latest chrome,firefox\n```'
            })

      - name: Store deployment metadata
        if: success()
        run: |
          echo "DEPLOYMENT_VERSION=${{ github.event.release.tag_name }}" >> deployment.env
          echo "DEPLOYMENT_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> deployment.env
          echo "CHROME_PACKAGE=blog-link-analyzer-$(node -p "require('./package.json').version").zip" >> deployment.env
          echo "FIREFOX_PACKAGE=blog-link-analyzer-firefox-$(node -p "require('./package.json').version").xpi" >> deployment.env

      - name: Upload deployment metadata
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-metadata-${{ github.event.release.tag_name }}
          path: deployment.env
          retention-days: 90

      - name: Validate deployment
        if: success()
        run: |
          chmod +x scripts/validate-deployment.sh
          ./scripts/validate-deployment.sh
