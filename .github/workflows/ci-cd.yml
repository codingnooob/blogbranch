name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci --ignore-scripts
      
    - name: Run linting
      run: npm run lint
      
    - name: Run type checking
      run: npm run typecheck
      
    - name: Run tests
      run: npm test
      
    - name: Build extension
      run: npm run build
      
    - name: Build Firefox version
      run: npm run build:firefox
      
    - name: Create packages
      run: npm run package:all-formats
      
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: extension-packages-${{ matrix.node-version }}
        path: |
          *.zip
          *.crx
          *.xpi
        retention-days: 30

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci --ignore-scripts
      
    - name: Run security audit
      run: npm audit --audit-level=moderate
      
    - name: Generate security report
      run: |
        echo "Security audit completed"
        npm audit --audit-level=moderate --json > security-report.json || true
        echo "Security report generated"

  release:
    needs: [test, security-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci --ignore-scripts
      
    - name: Build and package
      run: |
        npm run build
        npm run build:firefox
        npm run package:all-formats
        
    - name: Upload release assets
      uses: softprops/action-gh-release@v1
      with:
        files: |
          *.zip
          *.crx
          *.xpi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-stores:
    needs: [test, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci --ignore-scripts
      
    - name: Build and package
      run: |
        npm run build
        npm run build:firefox
        npm run package:all-formats
        
    - name: Deploy to Chrome Web Store
      run: |
        echo "Chrome Web Store deployment would go here"
        echo "Package: blog-link-analyzer-*.zip"
        echo "Configure with Chrome Web Store API credentials"
        
    - name: Deploy to Firefox Add-ons
      run: |
        echo "Firefox Add-ons deployment would go here"
        echo "Package: blog-link-analyzer-firefox-*.xpi"
        echo "Configure with Firefox Add-ons API credentials"