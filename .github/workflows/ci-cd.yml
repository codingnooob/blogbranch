      - name: Deploy to Chrome Web Store (Workload Identity Federation)
        id: chrome-deploy
        run: |
          echo "🔐 Using Workload Identity Federation for Chrome Web Store API V2"
          echo "📦 Extension ID: $CHROME_EXTENSION_ID"
          echo "🔑 Using OAuth refresh token directly"
          
          # Generate OAuth refresh token
          ACCESS_TOKEN=\$(curl -s -d "client_id=\${CHROME_CLIENT_ID}&client_secret=\${CHROME_CLIENT_SECRET}&refresh_token=\${CHROME_REFRESH_TOKEN}&grant_type=refresh_token" \\
            "https://oauth2.googleapis.com/token" \\
            -H "Content-Type: application/x-www-form-urlencoded" \\
            | jq -r .access_token)
          
          echo "🔑 Access token generated successfully"
          
          # Upload ZIP package using generated access token
          UPLOAD_RESPONSE=\$(curl -X POST \\
            "https://chromewebstore.googleapis.com/upload/v2/items/\${CHROME_EXTENSION_ID}?uploadType=PACKAGE" \\
            -H "Authorization: Bearer \$ACCESS_TOKEN" \\
            -H "x-goog-api-key: \${CHROME_API_KEY}" \\
            -F "data=@\$CHROME_ZIP_PATH" \\
            -w "%{http_code}")
          
          echo "📤 Upload response: \$UPLOAD_RESPONSE"
          
          if [ "\$UPLOAD_RESPONSE" != "200" ]; then
            echo "❌ Upload failed with status: \$UPLOAD_RESPONSE"
            exit 1
          fi
          
          # Publish extension using generated access token
          PUBLISH_RESPONSE=\$(curl -X POST \\
            "https://chromewebstore.googleapis.com/publish/v2/items/\${CHROME_EXTENSION_ID}" \\
            -H "Authorization: Bearer \$ACCESS_TOKEN" \\
            -H "x-goog-api-key: \${CHROME_API_KEY}" \\
            -H "Content-Type: application/json" \\
            -d '{"target": "TRUSTED_TESTERS"}' \\
            -w "%{http_code}")
          
          echo "🚀 Publish response: \$PUBLISH_RESPONSE"
          
          if [ "\$PUBLISH_RESPONSE" != "200" ]; then
            echo "❌ Publish failed with status: \$PUBLISH_RESPONSE"
            exit 1
          fi
          
          echo "✅ Chrome Web Store deployment completed successfully!"
        env:
          CHROME_EXTENSION_ID: \${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_API_KEY: \${{ secrets.CHROME_API_KEY }}
          CHROME_ZIP_PATH: \${{ env.CHROME_ZIP_PATH }}
          CHROME_CLIENT_ID: \${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: \${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: \${{ secrets.CHROME_REFRESH_TOKEN }}
