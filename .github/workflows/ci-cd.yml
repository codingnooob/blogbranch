      - name: Deploy to Chrome Web Store (chrome-webstore-upload)
        id: chrome-deploy
        run: |
          echo "🚀 Deploying to Chrome Web Store using chrome-webstore-upload package"
          echo "📦 Extension ID: $CHROME_EXTENSION_ID"
          echo "📁 ZIP Path: $CHROME_ZIP_PATH"
          
          # Install dependencies and deploy
          npm run deploy:chrome
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_ZIP_PATH: ${{ env.CHROME_ZIP_PATH }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}

      - name: Deploy to Chrome Web Store (Service Account - Fallback)
        id: chrome-deploy-fallback
        if: failure()
        run: |
          echo "🔄 Primary deployment failed, trying Service Account approach..."
          echo "🚀 Deploying to Chrome Web Store using Service Account"
          echo "📦 Extension ID: $CHROME_EXTENSION_ID"
          echo "📁 ZIP Path: $CHROME_ZIP_PATH"
          
          # Authenticate with Google Cloud using Workload Identity Federation
          gcloud auth login --brief --cred-config=${{ steps.auth.outputs.credentials_file_path }}
          
          # Deploy using service account
          npm run deploy:chrome-service-account
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_ZIP_PATH: ${{ env.CHROME_ZIP_PATH }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
