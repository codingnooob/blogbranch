<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="url(#grad1)" opacity="0.1"/>
  <circle cx="128" cy="128" r="110" fill="none" stroke="url(#grad1)" stroke-width="4"/>
  
  <!-- Central blog/document icon -->
  <rect x="80" y="60" width="96" height="120" rx="8" fill="url(#grad1)" opacity="0.9"/>
  <rect x="90" y="70" width="76" height="100" rx="4" fill="white"/>
  
  <!-- Document lines -->
  <rect x="100" y="80" width="56" height="4" rx="2" fill="#4F46E5"/>
  <rect x="100" y="90" width="56" height="4" rx="2" fill="#4F46E5"/>
  <rect x="100" y="100" width="40" height="4" rx="2" fill="#4F46E5"/>
  <rect x="100" y="110" width="56" height="4" rx="2" fill="#4F46E5"/>
  <rect x="100" y="120" width="48" height="4" rx="2" fill="#4F46E5"/>
  <rect x="100" y="130" width="56" height="4" rx="2" fill="#4F46E5"/>
  <rect x="100" y="140" width="36" height="4" rx="2" fill="#4F46E5"/>
  <rect x="100" y="150" width="56" height="4" rx="2" fill="#4F46E5"/>
  
  <!-- Link nodes around the central document -->
  <circle cx="50" cy="50" r="12" fill="url(#grad2)"/>
  <circle cx="206" cy="50" r="12" fill="url(#grad2)"/>
  <circle cx="50" cy="206" r="12" fill="url(#grad2)"/>
  <circle cx="206" cy="206" r="12" fill="url(#grad2)"/>
  
  <!-- Connection lines -->
  <line x1="62" y1="62" x2="80" y2="80" stroke="url(#grad2)" stroke-width="3" opacity="0.6"/>
  <line x1="194" y1="62" x2="176" y2="80" stroke="url(#grad2)" stroke-width="3" opacity="0.6"/>
  <line x1="62" y1="194" x2="80" y2="160" stroke="url(#grad2)" stroke-width="3" opacity="0.6"/>
  <line x1="194" y1="194" x2="176" y2="160" stroke="url(#grad2)" stroke-width="3" opacity="0.6"/>
  
  <!-- Small dots in link nodes -->
  <circle cx="50" cy="50" r="4" fill="white"/>
  <circle cx="206" cy="50" r="4" fill="white"/>
  <circle cx="50" cy="206" r="4" fill="white"/>
  <circle cx="206" cy="206" r="4" fill="white"/>
  
  <!-- AI/Analysis indicator -->
  <circle cx="128" cy="200" r="16" fill="#F59E0B" opacity="0.9"/>
  <text x="128" y="206" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">AI</text>
</svg>